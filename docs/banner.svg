<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-label="Klar: prompt injection protection for AI agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#10213f"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1D72FE"/>
      <stop offset="1" stop-color="#52C1FF"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#94A3B8" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <circle cx="1090" cy="40" r="230" fill="#1D72FE" fill-opacity=".14"/>

  <g transform="translate(90 92)">
    <rect width="84" height="84" rx="21" fill="#1D72FE"/>
    <path d="M42 15 19 25v16c0 14 9.7 25 23 28 13.3-3 23-14 23-28V25z" fill="none" stroke="#fff" stroke-width="5.2" stroke-linejoin="round"/>
    <path d="m31.5 42 7.9 7.9L54.5 35" fill="none" stroke="#fff" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="200" y="152" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="76" font-weight="800" fill="#fff">Klar</text>
  <circle cx="352" cy="132" r="8" fill="#1D72FE"/>
  <text x="90" y="236" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#F1F5F9">Your agent reads the web.</text>
  <text x="90" y="286" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="url(#acc)">Klar checks it before it obeys.</text>

  <g transform="translate(860 118)" font-family="JetBrains Mono, Consolas, monospace">
    <rect width="330" height="150" rx="18" fill="#0F172A" stroke="#1E293B"/>
    <circle cx="26" cy="24" r="6" fill="#FDA4AF"/><circle cx="46" cy="24" r="6" fill="#FCD34D"/><circle cx="66" cy="24" r="6" fill="#6EE7B7"/>
    <text x="24" y="70" font-size="17" fill="#FB7185" font-weight="700">BLOCK · 90 / 100</text>
    <text x="24" y="100" font-size="15" fill="#94A3B8">[prompt_injection]</text>
    <text x="24" y="124" font-size="15" fill="#94A3B8">ignore_previous</text>
  </g>
</svg>
